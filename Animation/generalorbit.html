    <script>
        gsap.registerPlugin(ScrollTrigger);

        gsap.utils.toArray(".star").forEach((star) => {

            gsap.fromTo(
                star,
                {
                    y: "-10%",
                    opacity: 1
                },
                {
                    y: () => `${100 * speed}%`,
                    opacity: 0,
                    ease: "none",
                    scrollTrigger: {
                        trigger: ".star-section",
                        start: "top bottom",
                        end: "bottom top",
                        scrub: true
                    }
                }
            );
        });
